<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BKK Live Tracker</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #map {
            height: 100%;
            width: 100%;
        }

        /* UI Control Wrapper at Top-Left */
        #ui-overlay {
            position: absolute;
            top: 10px;
            left: 55px; /* Offset from Leaflet zoom controls */
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-width: calc(100vw - 70px);
        }

        /* Search Filter UI Row */
        #filter-row {
            display: flex;
            align-items: center;
            gap: 6px;
            width: 100%;
        }

        #filter-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 6px 8px;
            border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            min-width: 0; /* Allows container to shrink on small mobile screens */
        }
        #filter-input {
            border: 1px solid #ccc;
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            width: 100%;
            min-width: 60px;
            font-weight: 500;
            box-sizing: border-box;
        }
        #filter-input:focus {
            border-color: #007bff;
            box-shadow: 0 0 4px rgba(0, 123, 255, 0.3);
        }

        /* Filter Mode Toggle Button */
        #mode-btn {
            background-color: #f8f9fa;
            border: 1px solid #ccc;
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            transition: all 0.2s;
            white-space: nowrap;
            flex-shrink: 0;
        }
        #mode-btn:hover {
            background-color: #e2e6ea;
        }

        /* Circular Profile Button */
        #profile-btn {
            width: 36px;
            height: 36px;
            min-width: 36px;
            min-height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
            outline: none;
            transition: background-color 0.2s;
            flex-shrink: 0; /* Prevents button from squishing or disappearing */
        }
        #profile-btn:hover {
            background-color: #e2e6ea;
        }
        #profile-btn.logged-in {
            border-color: #198754;
            background-color: #d1e7dd;
        }

        /* Logged Trips Button */
        #logged-trips-btn {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #ccc;
            padding: 7px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
            text-align: left;
            outline: none;
            color: #333;
            transition: background-color 0.2s;
            width: fit-content;
        }
        #logged-trips-btn:hover {
            background-color: #f1f3f5;
        }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2000;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.3);
            width: 320px;
            max-width: 90vw;
            max-height: 85vh;
            overflow-y: auto;
            box-sizing: border-box;
        }

        .transit-badge {
            padding: 2px 7px;
            font-weight: 800;
            font-size: 11px;
            border-radius: 5px;
            text-align: center;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.4);
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .badge-bus { background-color: #007bff; color: #ffffff; border: 1.5px solid #0056b3; }
        .badge-tram { background-color: #ffd700; color: #000000; border: 1.5px solid #d4ac0d; }
        .badge-trolley { background-color: #dc3545; color: #ffffff; border: 1.5px solid #a71d2a; }
        .badge-train { background-color: #002D62; color: #ffffff; border: 1.5px solid #001A3D; }
        .badge-suburban_rail { background-color: #198754; color: #ffffff; border: 1.5px solid #146c43; }
        .badge-na { background-color: #1a1a1a; color: #ffffff; border: 1.5px solid #444444; }

        @keyframes flash-stop {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.92); }
            100% { opacity: 1; transform: scale(1); }
        }
        .is-stopped { animation: flash-stop 1.2s infinite ease-in-out; }
    </style>
</head>
<body>

    <!-- UI Overlay Controls -->
    <div id="ui-overlay">
        <div id="filter-row">
            <!-- Search Filter Container -->
            <div id="filter-container">
                <input type="text" id="filter-input" placeholder="Filter..." />
                <button id="mode-btn" title="Click to change filter mode">🔍 All</button>
            </div>
            <!-- Circular Profile Button -->
            <button id="profile-btn" title="Account / Login">👤</button>
        </div>
        <!-- Logged Trips Button -->
        <button id="logged-trips-btn">📋 Logged Trips</button>
    </div>

    <!-- Auth Modal (Login / Register) -->
    <div id="auth-modal" class="modal">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <h3 id="auth-title" style="margin: 0; font-size: 16px; color: #111;">Account Login</h3>
