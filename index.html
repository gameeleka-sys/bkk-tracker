<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BKK Live Tracker</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #map {
            height: 100%;
            width: 100%;
        }

        /* UI Control Wrapper at Top-Left */
        #ui-overlay {
            position: absolute;
            top: 10px;
            left: 55px; /* Offset from Leaflet zoom controls */
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* Search Filter UI Overlay */
        #filter-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 6px 10px;
            border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #filter-input {
            border: 1px solid #ccc;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            width: 150px;
            font-weight: 500;
        }
        #filter-input:focus {
            border-color: #007bff;
            box-shadow: 0 0 4px rgba(0, 123, 255, 0.3);
        }

        /* Filter Mode Toggle Button */
        #mode-btn {
            background-color: #f8f9fa;
            border: 1px solid #ccc;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            transition: all 0.2s;
            white-space: nowrap;
        }
        #mode-btn:hover {
            background-color: #e2e6ea;
        }
        #mode-btn.mode-line {
            background-color: #007bff;
            color: white;
            border-color: #0056b3;
        }
        #mode-btn.mode-plate {
            background-color: #198754;
            color: white;
            border-color: #146c43;
        }

        /* Logged Trips Button */
        #logged-trips-btn {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #ccc;
            padding: 7px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
            text-align: left;
            outline: none;
            color: #333;
            transition: background-color 0.2s;
        }
        #logged-trips-btn:hover {
            background-color: #f1f3f5;
        }

        /* Modal for Logs */
        #logs-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2000;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.3);
            width: 400px;
            max-height: 85vh;
            overflow-y: auto;
            box-sizing: border-box;
        }

        .transit-badge {
            padding: 2px 7px;
            font-weight: 800;
            font-size: 11px;
            border-radius: 5px;
            text-align: center;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.4);
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        /* Vehicle-specific colors */
        .badge-bus { background-color: #007bff; color: #ffffff; border: 1.5px solid #0056b3; }
        .badge-tram { background-color: #ffd700; color: #000000; border: 1.5px solid #d4ac0d; }
        .badge-trolley { background-color: #dc3545; color: #ffffff; border: 1.5px solid #a71d2a; }
        .badge-train { background-color: #002D62; color: #ffffff; border: 1.5px solid #001A3D; }
        .badge-suburban_rail { background-color: #198754; color: #ffffff; border: 1.5px solid #146c43; }
        .badge-na { background-color: #1a1a1a; color: #ffffff; border: 1.5px solid #444444; }

        @keyframes flash-stop {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.92); }
            100% { opacity: 1; transform: scale(1); }
        }
        .is-stopped { animation: flash-stop 1.2s infinite ease-in-out; }
    </style>
</head>
<body>

    <!-- UI Overlay Controls -->
    <div id="ui-overlay">
        <!-- Search Filter Container -->
        <div id="filter-container">
            <input type="text" id="filter-input" placeholder="Filter..." />
            <button id="mode-btn" title="Click to change filter mode">🔍 All</button>
        </div>
        <!-- Logged Trips Button -->
        <button id="logged-trips-btn">📋 Logged Trips</button>
    </div>

    <!-- Modal for viewing logs -->
    <div id="logs-modal">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h3 id="logs-modal-title" style="margin: 0; font-size: 16px; color: #111;">Logged Trips</h3>
            <button id="close-logs-btn" style="background: none; border: none; font-size: 20px; cursor: pointer; font-weight: bold; color: #666;">&times;</button>
        </div>
        
        <div id="logs-content" style="font-size: 13px; color: #333;">Loading...</div>
    </div>

    <div id="map"></div>

    <!-- Firebase Client Module -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCYZ_dF-pSt-N1vzY0cCl9_-U6pdP9vMJo",
            authDomain: "budapestradar26.firebaseapp.com",
            projectId: "budapestradar26",
            storageBucket: "budapestradar26.firebasestorage.app",
            messagingSenderId: "258977567627",
            appId: "1:258977567627:web:aa600e0d1aad576e85158e",
            measurementId: "G-XRM4409JGL"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 1. Visitor Telemetry Logging
        function getClientInfo() {
            const ua = navigator.userAgent;
            let browser = "Unknown Browser";
            let os = "Unknown OS";

            if (ua.indexOf("Win") !== -1) os = "Windows";
            else if (ua.indexOf("Mac") !== -1) os = "macOS";
            else if (ua.indexOf("iPhone") !== -1 || ua.indexOf("iPad") !== -1) os = "iOS";
            else if (ua.indexOf("Android") !== -1) os = "Android";
            else if (ua.indexOf("Linux") !== -1) os = "Linux";

            if (ua.indexOf("Edg") !== -1) browser = "Microsoft Edge";
            else if (ua.indexOf("Chrome") !== -1 && ua.indexOf("Edg") === -1) browser = "Google Chrome";
            else if (ua.indexOf("Safari") !== -1 && ua.indexOf("Chrome") === -1) browser = "Apple Safari";
            else if (ua.indexOf("Firefox") !== -1) browser = "Mozilla Firefox";
            else if (ua.indexOf("Opera") !== -1 || ua.indexOf("OPR") !== -1) browser = "Opera";

            return { os, browser };
        }

        async function logVisitor() {
            try {
                const { os, browser } = getClientInfo();
                await addDoc(collection(db, "visits"), {
                    os: os,
                    browser: browser,
                    timestamp: new Date().toISOString()
                });
                console.log("Visitor telemetry logged.");
            } catch (error) {
                console.error("Visitor logging error:", error);
            }
        }

        logVisitor();

        // 2. Trip Logging from Vehicle Popups
        window.logTrip = async function(plate, line) {
            try {
                const docRef = await addDoc(collection(db, "trips"), {
                    licensePlate: plate || 'N/A',
                    line: line || 'N/A',
                    date: new Date().toISOString()
                });
                alert(`Trip logged successfully!\n\nDocument ID: ${docRef.id}\nLine: ${line}\nPlate: ${plate}`);
            } catch (error) {
                console.error("Trip logging error:", error);
                alert("Failed to log trip. Check console for details.");
            }
        };

        // 3. Load ONLY Logged Trips (for the button)
        window.loadLoggedTrips = async function() {
            const modal = document.getElementById('logs-modal');
            const titleEl = document.getElementById('logs-modal-title');
            const contentEl = document.getElementById('logs-content');
            
            modal.style.display = 'block';
            titleEl.textContent = 'Logged Trips';
            contentEl.innerHTML = 'Fetching trips from Firestore...';

            try {
                const tripsSnapshot = await getDocs(collection(db, "trips"));
                
                if (tripsSnapshot.empty) {
                    contentEl.innerHTML = '<p style="color: #666; font-size: 12px; text-align: center;">No logged trips found.</p>';
                    return;
                }

                let html = '<div style="max-height: 250px; overflow-y: auto;">';
                tripsSnapshot.forEach((doc) => {
                    const data = doc.data();
                    const dateStr = data.date ? new Date(data.date).toLocaleString() : 'N/A';
                    html += `
                        <div style="background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 6px; padding: 6px 10px; margin-bottom: 6px; font-size: 12px;">
                            <div><b>ID:</b> <span style="font-family: monospace; font-size: 10px; color: #555;">${doc.id}</span></div>
                            <div><b>Line:</b> ${data.line || 'N/A'} | <b>Plate:</b> ${data.licensePlate || 'N/A'}</div>
                            <div style="font-size: 11px; color: #888; margin-top: 2px;">${dateStr}</div>
                        </div>
                    `;
                });
                html += '</div>';
                contentEl.innerHTML = html;
            } catch (error) {
                console.error("Error fetching trips:", error);
                contentEl.innerHTML = '<p style="color: red; text-align: center;">Failed to load trips.</p>';
            }
        };

        // 4. Load BOTH Visits and Trips (Unlocked ONLY by Secret Code)
        window.loadAdminPanel = async function() {
            const modal = document.getElementById('logs-modal');
            const titleEl = document.getElementById('logs-modal-title');
            const contentEl = document.getElementById('logs-content');
            
            modal.style.display = 'block';
            titleEl.textContent = '🔒 Secure Admin Logs';
            contentEl.innerHTML = 'Fetching secure system logs...';

            try {
                const [tripsSnapshot, visitsSnapshot] = await Promise.all([
                    getDocs(collection(db, "trips")),
                    getDocs(collection(db, "visits"))
                ]);

                let html = '';

                // --- VISITOR LOGS SECTION ---
                html += `<h4 style="margin: 0 0 8px 0; color: #007bff; border-bottom: 2px solid #007bff; padding-bottom: 4px;">🌐 Visitor Telemetry (${visitsSnapshot.size})</h4>`;
                if (visitsSnapshot.empty) {
                    html += `<p style="color: #666; font-size: 12px; margin-bottom: 15px;">No visitor logs found.</p>`;
                } else {
                    html += `<div style="max-height: 150px; overflow-y: auto; margin-bottom: 15px;">`;
                    visitsSnapshot.forEach((doc) => {
                        const data = doc.data();
                        const dateStr = data.timestamp ? new Date(data.timestamp).toLocaleString() : 'N/A';
                        html += `
                            <div style="background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 6px; padding: 6px 10px; margin-bottom: 6px; font-size: 12px;">
                                <div><b>OS:</b> ${data.os || 'Unknown'} | <b>Browser:</b> ${data.browser || 'Unknown'}</div>
                                <div style="font-size: 11px; color: #888; margin-top: 2px;">${dateStr}</div>
                            </div>
                        `;
                    });
                    html += `</div>`;
                }

                // --- TRIP LOGS SECTION ---
                html += `<h4 style="margin: 0 0 8px 0; color: #198754; border-bottom: 2px solid #198754; padding-bottom: 4px;">🚌 Logged Trips (${tripsSnapshot.size})</h4>`;
                if (tripsSnapshot.empty) {
                    html += `<p style="color: #666; font-size: 12px;">No logged trips found.</p>`;
                } else {
                    html += `<div style="max-height: 150px; overflow-y: auto;">`;
                    tripsSnapshot.forEach((doc) => {
                        const data = doc.data();
                        const dateStr = data.date ? new Date(data.date).toLocaleString() : 'N/A';
                        html += `
                            <div style="background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 6px; padding: 6px 10px; margin-bottom: 6px; font-size: 12px;">
                                <div><b>ID:</b> <span style="font-family: monospace; font-size: 10px; color: #555;">${doc.id}</span></div>
                                <div><b>Line:</b> ${data.line || 'N/A'} | <b>Plate:</b> ${data.licensePlate || 'N/A'}</div>
                                <div style="font-size: 11px; color: #888; margin-top: 2px;">${dateStr}</div>
                            </div>
                        `;
                    });
                    html += `</div>`;
                }

                contentEl.innerHTML = html;
            } catch (error) {
                console.error("Error fetching admin logs:", error);
                contentEl.innerHTML = '<p style="color: red; text-align: center;">Failed to load system logs.</p>';
            }
        };

        // Button clicks open ONLY the normal trip viewer
        document.getElementById('logged-trips-btn').addEventListener('click', () => {
            window.loadLoggedTrips();
        });

        document.getElementById('close-logs-btn').addEventListener('click', () => {
            document.getElementById('logs-modal').style.display = 'none';
        });
    </script>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([47.4979, 19.0402], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        const markers = {};
        const markerMeta = {};
        const NORMAL_HIDE_ZOOM = 13;
        const FILTER_HIDE_ZOOM = 11;
        let currentFilterQuery = '';
        let filterMode = 0; // 0: All, 1: Line Only, 2: Plate Only

        // SHA-256 hash for "radar/admin/it"
        const SECRET_HASH = "7c5ff0531c3c97db0e34c9c2d12e6dd23a49339e7b28a8d05370d9e4c194d308";

        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        const inputEl = document.getElementById('filter-input');
        const modeBtn = document.getElementById('mode-btn');

        inputEl.addEventListener('input', async (e) => {
            const rawValue = e.target.value.trim();

            if (rawValue.length > 0) {
                // Compute SHA-256 on lowercased input for consistent match
                const typedHash = await sha256(rawValue.toLowerCase());
                if (typedHash === SECRET_HASH) {
                    inputEl.value = '';
                    currentFilterQuery = '';
                    updateVisibilityForAllMarkers();
                    if (window.loadAdminPanel) {
                        window.loadAdminPanel();
                    }
                    return;
                }
            }

            currentFilterQuery = rawValue.toLowerCase();
            updateVisibilityForAllMarkers();
        });

        modeBtn.addEventListener('click', () => {
            filterMode = (filterMode + 1) % 3;
            
            if (filterMode === 0) {
                modeBtn.textContent = '🔍 All';
                modeBtn.className = '';
                inputEl.placeholder = "Filter line or plate...";
            } else if (filterMode === 1) {
                modeBtn.textContent = '🚌 Line Only';
                modeBtn.className = 'mode-line';
                inputEl.placeholder = "Filter line (exact)...";
            } else if (filterMode === 2) {
                modeBtn.textContent = '🚗 Plate Only';
                modeBtn.className = 'mode-plate';
                inputEl.placeholder = "Filter plate...";
            }

            updateVisibilityForAllMarkers();
        });

        function getNormalizedVehicleType(v) {
            const rawType = String(v.vehicleType || '').toLowerCase();
            const routeNum = String(v.routeNumber || '').toUpperCase();

            if (/^H[5-9]$/.test(routeNum) || routeNum.includes('HÉV') || routeNum.includes('HEV')) {
                return 'suburban_rail';
            }
            if (rawType === 'tram') return 'tram';
            if (rawType === 'trolley') return 'trolley';
            if (rawType === 'train') return 'train';
            if (rawType === 'suburban_rail') return 'suburban_rail';
            return 'bus';
        }

        function shouldDisplayMarker(id) {
            const currentZoom = map.getZoom();
            
            const effectiveThreshold = currentFilterQuery ? FILTER_HIDE_ZOOM : NORMAL_HIDE_ZOOM;
            if (currentZoom < effectiveThreshold) return false;

            if (!currentFilterQuery) return true;

            const meta = markerMeta[id];
            if (!meta) return false;

            if (filterMode === 1) {
                return meta.routeNumber === currentFilterQuery;
            } else if (filterMode === 2) {
                return meta.licensePlate.includes(currentFilterQuery);
            } else {
                const matchesLine = meta.routeNumber === currentFilterQuery;
                const matchesPlate = meta.licensePlate.includes(currentFilterQuery);
                return matchesLine || matchesPlate;
            }
        }

        function updateVisibilityForAllMarkers() {
            for (let id in markers) {
                const marker = markers[id];
                if (shouldDisplayMarker(id)) {
                    if (!map.hasLayer(marker)) marker.addTo(map);
                } else {
                    if (map.hasLayer(marker)) map.removeLayer(marker);
                }
            }
        }

        async function fetchVehicles() {
            try {
                const response = await fetch('https://busradar26.onrender.com/api/buses');
                const vehicles = await response.json();

                const currentVehicleIds = new Set();

                vehicles.forEach(v => {
                    currentVehicleIds.add(v.id);

                    let displayLabel = v.routeNumber || 'N/A';
                    const lat = v.latitude;
                    const lon = v.longitude;
                    const licensePlate = v.licensePlate || 'N/A';

                    if (!lat || !lon) return;

                    markerMeta[v.id] = {
                        routeNumber: displayLabel.toLowerCase(),
                        licensePlate: licensePlate.toLowerCase()
                    };

                    const vType = getNormalizedVehicleType(v);
                    let colorClass = `badge-${vType}`;

                    if (!displayLabel || displayLabel === 'N/A') {
                        colorClass = 'badge-na';
                    }

                    const isStopped = v.currentStatus === 'STOPPED_AT' || v.currentStatus === 0;
                    const stopClass = isStopped ? 'is-stopped' : '';

                    const vehicleIcon = L.divIcon({
                        className: '',
                        html: `<div class="transit-badge ${colorClass} ${stopClass}">${displayLabel}</div>`,
                        iconSize: [38, 20],
                        iconAnchor: [19, 10]
                    });

                    const destination = v.destination || 'In Service';
                    const popupContent = `
                        <b>Line:</b> ${displayLabel}<br>
                        <b>Type:</b> ${vType.toUpperCase().replace('_', ' ')}<br>
                        <b>Destination:</b> ${destination}<br>
                        <b>Plate:</b> ${licensePlate}<br><br>
                        <button onclick="logTrip('${licensePlate}', '${displayLabel}')" style="background-color: #007bff; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-weight: 600; cursor: pointer; width: 100%;">Log trip</button>
                    `;

                    if (markers[v.id]) {
                        markers[v.id].setLatLng([lat, lon]);
                        markers[v.id].setIcon(vehicleIcon);
                        markers[v.id].bindPopup(popupContent);
                    } else {
                        const marker = L.marker([lat, lon], { icon: vehicleIcon });
                        marker.bindPopup(popupContent);
                        markers[v.id] = marker;
                    }
                });

                for (let id in markers) {
                    if (!currentVehicleIds.has(id)) {
                        map.removeLayer(markers[id]);
                        delete markers[id];
                        delete markerMeta[id];
                    }
                }

                updateVisibilityForAllMarkers();

            } catch (err) {
                console.error('Error fetching vehicles:', err);
            }
        }

        map.on('zoomend', () => {
            updateVisibilityForAllMarkers();
        });

        fetchVehicles();
        setInterval(fetchVehicles, 5000);
    </script>
</body>
</html>
