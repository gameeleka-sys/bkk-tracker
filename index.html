<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BKK Live Tracker</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #map {
            height: 100%;
            width: 100%;
        }
        /* Black box styling for unnumbered / transit vehicles */
        .transit-black-box {
            background: #000;
            color: #fff;
            padding: 2px 6px;
            font-weight: bold;
            font-size: 11px;
            border-radius: 3px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize map centered on Budapest
        const map = L.map('map').setView([47.4979, 19.0402], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        const markers = {};

        async function fetchVehicles() {
            try {
                // REPLACE WITH YOUR ACTUAL RENDER URL BELOW
                const response = await fetch('https://busradar26.onrender.com/api/buses');
                const vehicles = await response.json();

                const currentVehicleIds = new Set();

                vehicles.forEach(v => {
                    currentVehicleIds.add(v.id);

                    let displayLabel = v.label;
                    if (displayLabel === '100E') {
                        displayLabel = 'AIRPORT EXPRESS';
                    }

                    const lat = v.lat;
                    const lon = v.lon;

                    if (markers[v.id]) {
                        markers[v.id].setLatLng([lat, lon]);
                        markers[v.id].bindPopup(`<b>Line:</b> ${displayLabel}<br><b>Model:</b> ${v.model}<br><b>Plate:</b> ${v.licensePlate || 'N/A'}`);
                    } else {
                        const marker = L.marker([lat, lon]).addTo(map);
                        marker.bindPopup(`<b>Line:</b> ${displayLabel}<br><b>Model:</b> ${v.model}<br><b>Plate:</b> ${v.licensePlate || 'N/A'}`);
                        markers[v.id] = marker;
                    }
                });

                // Remove stale markers
                for (let id in markers) {
                    if (!currentVehicleIds.has(id)) {
                        map.removeLayer(markers[id]);
                        delete markers[id];
                    }
                }
            } catch (err) {
                console.error('Error fetching vehicles:', err);
            }
        }

        // Fetch immediately and then every 5 seconds
        fetchVehicles();
        setInterval(fetchVehicles, 5000);
    </script>
</body>
</html>
