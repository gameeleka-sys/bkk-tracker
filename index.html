<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BusRadar26</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #map { height: 100%; width: 100%; }

        #ui-overlay {
            position: absolute; top: 10px; left: 55px; z-index: 1000;
            display: flex; flex-direction: column; gap: 6px; max-width: calc(100vw - 70px);
        }

        #filter-row { display: flex; align-items: center; gap: 6px; width: 100%; }
        #filter-container {
            background: rgba(255, 255, 255, 0.95); padding: 6px 8px; border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25); display: flex; align-items: center; gap: 6px; flex: 1;
        }
        #filter-input {
            border: 1px solid #ccc; padding: 6px 8px; border-radius: 6px; font-size: 13px;
            outline: none; width: 100%; font-weight: 500;
        }
        #profile-btn {
            width: 36px; height: 36px; border-radius: 50%; background: rgba(255, 255, 255, 0.95);
            border: 1px solid #ccc; display: flex; align-items: center; justify-content: center;
            font-size: 16px; cursor: pointer; box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
        }
        #profile-btn.logged-in { border-color: #198754; background-color: #d1e7dd; }
        #profile-btn.is-admin { border-color: #dc3545; background-color: #f8d7da; }

        .btn-group { display: flex; gap: 6px; }
        .action-btn {
            background: rgba(255, 255, 255, 0.95); border: 1px solid #ccc; padding: 7px 12px;
            border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25); color: #333;
        }

        .modal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 2000; background: white; padding: 20px; border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.3); width: 320px; max-width: 90vw; max-height: 85vh; overflow-y: auto;
        }

        /* Full page admin panel styling */
        #admin-fullscreen-panel {
            display: none; position: fixed; inset: 0; z-index: 3000; background: #f4f6f9;
            flex-direction: column; padding: 20px; box-sizing: border-box; overflow-y: auto;
        }

        .transit-badge {
            padding: 2px 7px; font-weight: 800; font-size: 11px; border-radius: 5px;
            text-align: center; box-shadow: 0 3px 8px rgba(0, 0, 0, 0.4); white-space: nowrap;
            display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box;
        }
        .badge-bus { background-color: #007bff; color: #ffffff; border: 1.5px solid #0056b3; }
        .badge-tram { background-color: #ffd700; color: #000000; border: 1.5px solid #d4ac0d; }
        .badge-trolley { background-color: #dc3545; color: #ffffff; border: 1.5px solid #a71d2a; }
        .badge-train { background-color: #002D62; color: #ffffff; border: 1.5px solid #001A3D; }
        .badge-suburban_rail { background-color: #198754; color: #ffffff; border: 1.5px solid #146c43; }
        .badge-na { background-color: #1a1a1a; color: #ffffff; border: 1.5px solid #444444; }

        @keyframes flash-stop {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.92); }
            100% { opacity: 1; transform: scale(1); }
        }
        .is-stopped { animation: flash-stop 1.2s infinite ease-in-out; }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <div id="filter-row">
            <div id="filter-container">
                <input type="text" id="filter-input" placeholder="Filter..." />
                <button id="mode-btn" title="Click to change filter mode">🔍 All</button>
            </div>
            <button id="profile-btn" title="Account / Login">👤</button>
        </div>
        <div class="btn-group">
            <button id="logged-trips-btn" class="action-btn">📋 Logged Trips</button>
            <button id="admin-panel-btn" class="action-btn" style="display: none; border-color: #dc3545; color: #dc3545;">🔒 Admin Panel</button>
        </div>
    </div>

    <!-- Full Page Admin Panel -->
    <div id="admin-fullscreen-panel">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #ddd; padding-bottom: 10px;">
            <h2 style="margin: 0; color: #dc3545;">🔒 Full-Page Admin Dashboard</h2>
            <button id="close-admin-fullscreen" style="background: #333; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold;">Exit Admin Panel</button>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; flex: 1; overflow: hidden;">
            <!-- Column 1: User Management & Creator -->
            <div style="background: white; border: 1px solid #ccc; border-radius: 8px; padding: 15px; display: flex; flex-direction: column; overflow: hidden;">
                <h3 style="margin-top: 0; color: #007bff;">👥 User Management & Creation</h3>
                
                <!-- Create User Form -->
                <div style="background: #f8f9fa; padding: 10px; border-radius: 6px; margin-bottom: 15px; border: 1px solid #eee;">
                    <h4 style="margin: 0 0 8px 0; font-size: 13px;">Create New User</h4>
                    <input type="email" id="new-user-email" placeholder="Email" style="width: 100%; padding: 6px; margin-bottom: 6px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;" />
                    <input type="password" id="new-user-pass" placeholder="Password" style="width: 100%; padding: 6px; margin-bottom: 6px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;" />
                    <label style="font-size: 12px; display: flex; align-items: center; gap: 6px; margin-bottom: 8px;">
                        <input type="checkbox" id="new-user-admin" /> Make Admin Immediately
                    </label>
                    <button id="create-user-submit" style="width: 100%; background: #198754; color: white; border: none; padding: 6px; border-radius: 4px; font-weight: bold; cursor: pointer;">Create User</button>
                </div>

                <h4 style="margin: 0 0 8px 0; font-size: 13px;">Existing Users (Click to Manage)</h4>
                <div id="admin-user-list" style="flex: 1; overflow-y: auto; border: 1px solid #eee; border-radius: 6px; padding: 6px; background: #fafafa;">
                    Loading users...
                </div>
            </div>

            <!-- Column 2: Individual User Logs -->
            <div style="background: white; border: 1px solid #ccc; border-radius: 8px; padding: 15px; display: flex; flex-direction: column; overflow: hidden;">
                <h3 id="selected-user-logs-title" style="margin-top: 0; color: #198754;">📋 User Logs (Select a user from left)</h3>
                <div id="admin-user-logs-content" style="flex: 1; overflow-y: auto; border: 1px solid #eee; border-radius: 6px; padding: 8px; background: #fafafa; font-size: 13px;">
                    No user selected. Click any user on the left panel to inspect their logs.
                </div>
            </div>
        </div>
    </div>

    <div id="auth-modal" class="modal">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <h3 id="auth-title" style="margin: 0; font-size: 16px;">Account Login</h3>
            <button id="close-auth-btn" style="background: none; border: none; font-size: 20px; cursor: pointer;">&times;</button>
        </div>
        <div id="auth-body">
            <input type="email" id="auth-email" placeholder="Email" style="width: 100%; padding: 8px; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;" />
            <input type="password" id="auth-password" placeholder="Password" style="width: 100%; padding: 8px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;" />
            <button id="auth-submit-btn" style="width: 100%; background: #007bff; color: white; border: none; padding: 8px; border-radius: 6px; font-weight: 600; cursor: pointer;">Sign In</button>
        </div>
        <div id="auth-logged-in-view" style="display: none; text-align: center;">
            <p id="user-email-display" style="font-size: 13px; margin-bottom: 15px; font-weight: 500;"></p>
            <button id="logout-btn" style="width: 100%; background: #dc3545; color: white; border: none; padding: 8px; border-radius: 6px; font-weight: 600; cursor: pointer;">Sign Out</button>
        </div>
    </div>

    <div id="logs-modal" class="modal">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h3 style="margin: 0; font-size: 16px;">Your Logged Trips</h3>
            <button id="close-logs-btn" style="background: none; border: none; font-size: 20px; cursor: pointer;">&times;</button>
        </div>
        <div id="logs-content" style="font-size: 13px;">Loading...</div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const ADMIN_EMAIL = "br26.admin@gmail.com";
        const firebaseConfig = {
            apiKey: "AIzaSyCYZ_dF-pSt-N1vzY0cCl9_-U6pdP9vMJo",
            authDomain: "budapestradar26.firebaseapp.com",
            projectId: "budapestradar26",
            storageBucket: "budapestradar26.firebasestorage.app",
            messagingSenderId: "258977567627",
            appId: "1:258977567627:web:aa600e0d1aad576e85158e"
        };

        if (typeof firebase !== 'undefined') {
            try { firebase.initializeApp(firebaseConfig); } catch (e) {}
        }

        const db = firebase.firestore();
        const auth = firebase.auth();

        let currentUser = null;
        let isAdmin = false;

        auth.onAuthStateChanged(async (user) => {
            currentUser = user;
            const profileBtn = document.getElementById('profile-btn');
            const adminBtn = document.getElementById('admin-panel-btn');
            if (user && user.email) {
                const tokenResult = await user.getIdTokenResult(true);
                isAdmin = tokenResult.claims.admin || user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase();

                if (isAdmin) {
                    profileBtn.classList.add('is-admin');
                    adminBtn.style.display = 'block';
                } else {
                    profileBtn.classList.add('logged-in');
                    adminBtn.style.display = 'none';
                }
            } else {
                isAdmin = false;
                profileBtn.classList.remove('logged-in', 'is-admin');
                adminBtn.style.display = 'none';
            }
        });

        document.getElementById('profile-btn').onclick = () => document.getElementById('auth-modal').style.display = 'block';
        document.getElementById('close-auth-btn').onclick = () => document.getElementById('auth-modal').style.display = 'none';
        
        document.getElementById('auth-submit-btn').onclick = async () => {
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value.trim();
            try {
                await auth.signInWithEmailAndPassword(email, password);
                document.getElementById('auth-modal').style.display = 'none';
            } catch (err) { alert(err.message); }
        };

        document.getElementById('logout-btn').onclick = async () => {
            await auth.signOut();
            document.getElementById('auth-modal').style.display = 'none';
        };

        // Full Page Admin Panel Logic
        const adminPanel = document.getElementById('admin-fullscreen-panel');
        document.getElementById('admin-panel-btn').onclick = () => {
            adminPanel.style.display = 'flex';
            loadAdminUsers();
        };
        document.getElementById('close-admin-fullscreen').onclick = () => {
            adminPanel.style.display = 'none';
        };

        async function loadAdminUsers() {
            const listEl = document.getElementById('admin-user-list');
            listEl.innerHTML = 'Loading users...';
            try {
                const res = await fetch('/api/admin/users');
                const users = await res.json();
                
                listEl.innerHTML = '';
                users.forEach(u => {
                    const div = document.createElement('div');
                    div.style.cssText = 'background: white; border: 1px solid #ddd; padding: 8px; border-radius: 4px; margin-bottom: 6px; cursor: pointer;';
                    div.innerHTML = `
                        <div><b>${u.email}</b> ${u.isAdmin ? '👑' : ''} ${u.disabled ? '🚫 (Disabled)' : ''}</div>
                        <div style="font-size: 11px; color: #666;">UID: ${u.uid}</div>
                    `;
                    div.onclick = () => selectUserForAdmin(u);
                    listEl.appendChild(div);
                });
            } catch (err) {
                listEl.innerHTML = 'Failed to load users.';
            }
        }

        async function selectUserForAdmin(u) {
            const titleEl = document.getElementById('selected-user-logs-title');
            const contentEl = document.getElementById('admin-user-logs-content');
            
            titleEl.textContent = `📋 Logs & Actions for ${u.email}`;
            contentEl.innerHTML = `
                <div style="background: #e9ecef; padding: 8px; border-radius: 4px; margin-bottom: 10px; display: flex; gap: 6px; flex-wrap: wrap;">
                    <button onclick="modifyUser('${u.uid}', ${!u.isAdmin}, null)" style="background: ${u.isAdmin ? '#ffc107' : '#0d6efd'}; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold;">
                        ${u.isAdmin ? 'Take Away Admin' : 'Promote to Admin'}
                    </button>
                    <button onclick="modifyUser('${u.uid}', null, ${!u.disabled})" style="background: ${u.disabled ? '#198754' : '#dc3545'}; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold;">
                        ${u.disabled ? 'Activate Account' : 'Deactivate Account'}
                    </button>
                </div>
                <div id="user-specific-logs">Loading logs...</div>
            `;

            try {
                const snapshot = await db.collection("trips").where("userId", "==", u.uid).get();
                const logsContainer = document.getElementById('user-specific-logs');
                if (snapshot.empty) {
                    logsContainer.innerHTML = '<p style="color: #666; font-size: 12px;">No logged trips for this user.</p>';
                    return;
                }
                let html = '';
                snapshot.forEach(doc => {
                    const data = doc.data();
                    html += `
                        <div style="background: white; border: 1px solid #ddd; padding: 6px; border-radius: 4px; margin-bottom: 4px; font-size: 12px;">
                            Line: <b>${data.line}</b> | Plate: <b>${data.licensePlate}</b><br><span style="color: #888; font-size: 10px;">${new Date(data.date).toLocaleString()}</span>
                        </div>
                    `;
                });
                logsContainer.innerHTML = html;
            } catch (err) {
                document.getElementById('user-specific-logs').innerHTML = 'Error loading logs.';
            }
        }

        window.modifyUser = async function(uid, makeAdmin, disabled) {
            try {
                const res = await fetch('/api/admin/modify-user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ uid, makeAdmin, disabled })
                });
                if (!res.ok) throw new Error('Action failed');
                alert('User updated successfully!');
                loadAdminUsers();
            } catch (err) {
                alert('Error: ' + err.message);
            }
        };

        document.getElementById('create-user-submit').onclick = async () => {
            const email = document.getElementById('new-user-email').value.trim();
            const password = document.getElementById('new-user-pass').value.trim();
            const makeAdmin = document.getElementById('new-user-admin').checked;

            if (!email || !password) {
                alert('Please provide email and password.');
                return;
            }

            try {
                const res = await fetch('/api/admin/create-user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, makeAdmin })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);
                alert('User created successfully!');
                document.getElementById('new-user-email').value = '';
                document.getElementById('new-user-pass').value = '';
                document.getElementById('new-user-admin').checked = false;
                loadAdminUsers();
            } catch (err) {
                alert('Creation failed: ' + err.message);
            }
        };

        // Log Trips Modal Logic
        document.getElementById('logged-trips-btn').onclick = async () => {
            if (!currentUser) {
                alert("Please log in to view your logged trips.");
                document.getElementById('auth-modal').style.display = 'block';
                return;
            }
            const modal = document.getElementById('logs-modal');
            const contentEl = document.getElementById('logs-content');
            modal.style.display = 'block';
            contentEl.innerHTML = 'Fetching your trips...';

            try {
                const snapshot = await db.collection("trips").where("userId", "==", currentUser.uid).get();
                if (snapshot.empty) {
                    contentEl.innerHTML = '<p style="color: #666; font-size: 12px; text-align: center;">No logged trips found for your account.</p>';
                    return;
                }
                let html = '<div style="max-height: 250px; overflow-y: auto;">';
                snapshot.forEach(doc => {
                    const data = doc.data();
                    html += `
                        <div style="background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 6px; padding: 6px 10px; margin-bottom: 6px; font-size: 12px;">
                            <div><b>Line:</b> ${data.line || 'N/A'} | <b>Plate:</b> ${data.licensePlate || 'N/A'}</div>
                            <div style="font-size: 11px; color: #888; margin-top: 2px;">${new Date(data.date).toLocaleString()}</div>
                        </div>
                    `;
                });
                html += '</div>';
                contentEl.innerHTML = html;
            } catch (err) {
                contentEl.innerHTML = '<p style="color: red; text-align: center;">Failed to load trips.</p>';
            }
        };
        document.getElementById('close-logs-btn').onclick = () => document.getElementById('logs-modal').style.display = 'none';

        // Map and Vehicle Fetching Logic
        const map = L.map('map').setView([47.4979, 19.0402], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        const markers = {};
        const markerMeta = {};
        const NORMAL_HIDE_ZOOM = 13;
        const FILTER_HIDE_ZOOM = 11;
        let currentFilterQuery = '';
        let filterMode = 0;

        const inputEl = document.getElementById('filter-input');
        const modeBtn = document.getElementById('mode-btn');

        inputEl.addEventListener('input', (e) => {
            currentFilterQuery = e.target.value.trim().toLowerCase();
            updateVisibilityForAllMarkers();
        });

        modeBtn.addEventListener('click', () => {
            filterMode = (filterMode + 1) % 3;
            if (filterMode === 0) {
                modeBtn.textContent = '🔍 All';
                inputEl.placeholder = "Filter line or plate...";
            } else if (filterMode === 1) {
                modeBtn.textContent = '🚌 Line Only';
                inputEl.placeholder = "Filter line (exact)...";
            } else if (filterMode === 2) {
                modeBtn.textContent = '🚗 Plate Only';
                inputEl.placeholder = "Filter plate...";
            }
            updateVisibilityForAllMarkers();
        });

        function formatRouteNumber(routeNum) {
            if (!routeNum) return 'N/A';
            const clean = String(routeNum).trim().toUpperCase();
            if (clean === '0161') return '16A';
            if (clean === '0085') return '8E';
            return routeNum;
        }

        function getNormalizedVehicleType(v, formattedRoute) {
            const rawType = String(v.vehicleType || '').toLowerCase();
            const routeNum = String(formattedRoute || '').toUpperCase();
            if (/^H[5-9]$/.test(routeNum) || routeNum.includes('HÉV') || routeNum.includes('HEV')) return 'suburban_rail';
            if (rawType === 'tram') return 'tram';
            if (rawType === 'trolley') return 'trolley';
            if (rawType === 'train') return 'train';
            if (rawType === 'suburban_rail') return 'suburban_rail';
            return 'bus';
        }

        function shouldDisplayMarker(id) {
            const currentZoom = map.getZoom();
            const effectiveThreshold = currentFilterQuery ? FILTER_HIDE_ZOOM : NORMAL_HIDE_ZOOM;
            if (currentZoom < effectiveThreshold) return false;
            if (!currentFilterQuery) return true;

            const meta = markerMeta[id];
            if (!meta) return false;

            if (filterMode === 1) return meta.routeNumber === currentFilterQuery;
            if (filterMode === 2) return meta.licensePlate.includes(currentFilterQuery);
            return meta.routeNumber === currentFilterQuery || meta.licensePlate.includes(currentFilterQuery);
        }

        function updateVisibilityForAllMarkers() {
            for (let id in markers) {
                const marker = markers[id];
                if (shouldDisplayMarker(id)) {
                    if (!map.hasLayer(marker)) marker.addTo(map);
                } else {
                    if (map.hasLayer(marker)) map.removeLayer(marker);
                }
            }
        }

        window.logTrip = async function(plate, line) {
            if (!currentUser) {
                alert("You must be logged in to log trips! Tap the 👤 profile button to sign in.");
                document.getElementById('auth-modal').style.display = 'block';
                return;
            }
            try {
                await db.collection("trips").add({
                    userId: currentUser.uid,
                    userEmail: currentUser.email,
                    licensePlate: plate || 'N/A',
                    line: line || 'N/A',
                    date: new Date().toISOString()
                });
                alert(`Trip logged successfully!\n\nLine: ${line}\nPlate: ${plate}`);
            } catch (err) {
                alert("Failed to log trip.");
            }
        };

        async function fetchVehicles() {
            try {
                const response = await fetch('/api/buses');
                const vehicles = await response.json();
                const currentVehicleIds = new Set();

                vehicles.forEach(v => {
                    currentVehicleIds.add(v.id);
                    let displayLabel = formatRouteNumber(v.routeNumber);
                    const lat = v.latitude;
                    const lon = v.longitude;
                    const licensePlate = v.licensePlate || 'N/A';

                    if (!lat || !lon) return;

                    markerMeta[v.id] = {
                        routeNumber: displayLabel.toLowerCase(),
                        licensePlate: licensePlate.toLowerCase()
                    };

                    const vType = getNormalizedVehicleType(v, displayLabel);
                    const isStopped = v.currentStatus === 'STOPPED_AT' || v.currentStatus === 0;
                    const vehicleIcon = L.divIcon({
                        className: '',
                        html: `<div class="transit-badge badge-${vType} ${isStopped ? 'is-stopped' : ''}">${displayLabel}</div>`,
                        iconSize: [38, 20],
                        iconAnchor: [19, 10]
                    });

                    const popupContent = `
                        <b>Line:</b> ${displayLabel}<br>
                        <b>Type:</b> ${vType.toUpperCase().replace('_', ' ')}<br>
                        <b>Destination:</b> ${v.destination || 'In Service'}<br>
                        <b>Plate:</b> ${licensePlate}<br><br>
                        <button onclick="logTrip('${licensePlate}', '${displayLabel}')" style="background-color: #007bff; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-weight: 600; cursor: pointer; width: 100%;">Log trip</button>
                    `;

                    if (markers[v.id]) {
                        markers[v.id].setLatLng([lat, lon]);
                        markers[v.id].setIcon(vehicleIcon);
                        markers[v.id].bindPopup(popupContent);
                    } else {
                        const marker = L.marker([lat, lon], { icon: vehicleIcon });
                        marker.bindPopup(popupContent);
                        markers[v.id] = marker;
                    }
                });

                for (let id in markers) {
                    if (!currentVehicleIds.has(id)) {
                        map.removeLayer(markers[id]);
                        delete markers[id];
                        delete markerMeta[id];
                    }
                }
                updateVisibilityForAllMarkers();
            } catch (err) {
                console.error('Error fetching vehicles:', err);
            }
        }

        map.on('zoomend', updateVisibilityForAllMarkers);
        fetchVehicles();
        setInterval(fetchVehicles, 5000);
    </script>
</body>
</html>
