<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BKK Live Tracker</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #map {
            height: 100%;
            width: 100%;
        }

        /* Standalone badge box styling */
        .transit-badge {
            padding: 4px 7px;
            font-weight: 800;
            font-size: 11px;
            border-radius: 6px;
            text-align: center;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.4);
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        /* Vehicle-specific colors */
        .badge-bus {
            background-color: #007bff;
            color: #ffffff;
            border: 1.5px solid #0056b3;
        }

        .badge-tram {
            background-color: #ffd700;
            color: #000000;
            border: 1.5px solid #d4ac0d;
        }

        .badge-trolley {
            background-color: #dc3545;
            color: #ffffff;
            border: 1.5px solid #a71d2a;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([47.4979, 19.0402], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        const markers = {};

        async function fetchVehicles() {
            try {
                const response = await fetch('https://busradar26.onrender.com/api/buses');
                const vehicles = await response.json();

                const currentVehicleIds = new Set();

                vehicles.forEach(v => {
                    currentVehicleIds.add(v.id);

                    let displayLabel = v.routeNumber || 'Bus';
                    if (displayLabel === '100E') {
                        displayLabel = '100E';
                    }

                    const lat = v.latitude;
                    const lon = v.longitude;

                    if (!lat || !lon) return;

                    const vType = (v.vehicleType || 'bus').toLowerCase();

                    // Clear className so Leaflet doesn't add unwanted wrappers, render box via HTML
                    const vehicleIcon = L.divIcon({
                        className: '',
                        html: `<div class="transit-badge badge-${vType}">${displayLabel}</div>`,
                        iconSize: [40, 24],
                        iconAnchor: [20, 12]
                    });

                    const popupContent = `<b>Line:</b> ${v.routeNumber}<br><b>Type:</b> ${vType.toUpperCase()}<br><b>Model:</b> ${v.vehicleModel || 'Unknown'}<br><b>Plate:</b> ${v.licensePlate || 'N/A'}`;

                    if (markers[v.id]) {
                        markers[v.id].setLatLng([lat, lon]);
                        markers[v.id].setIcon(vehicleIcon);
                        markers[v.id].bindPopup(popupContent);
                    } else {
                        const marker = L.marker([lat, lon], { icon: vehicleIcon }).addTo(map);
                        marker.bindPopup(popupContent);
                        markers[v.id] = marker;
                    }
                });

                // Remove stale markers
                for (let id in markers) {
                    if (!currentVehicleIds.has(id)) {
                        map.removeLayer(markers[id]);
                        delete markers[id];
                    }
                }
            } catch (err) {
                console.error('Error fetching vehicles:', err);
            }
        }

        fetchVehicles();
        setInterval(fetchVehicles, 5000);
    </script>
</body>
</html>
