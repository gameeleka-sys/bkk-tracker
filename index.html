<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BKK Live Tracker</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #map {
            height: 100%;
            width: 100%;
        }

        .transit-badge {
            padding: 2px 7px;
            font-weight: 800;
            font-size: 11px;
            border-radius: 5px;
            text-align: center;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.4);
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        /* Vehicle-specific colors */
        .badge-bus {
            background-color: #007bff;
            color: #ffffff;
            border: 1.5px solid #0056b3;
        }

        .badge-tram {
            background-color: #ffd700;
            color: #000000;
            border: 1.5px solid #d4ac0d;
        }

        .badge-trolley {
            background-color: #dc3545;
            color: #ffffff;
            border: 1.5px solid #a71d2a;
        }

        .badge-train {
            background-color: #002D62;
            color: #ffffff;
            border: 1.5px solid #001A3D;
        }

        .badge-suburban_rail {
            background-color: #198754;
            color: #ffffff;
            border: 1.5px solid #146c43;
        }

        .badge-na {
            background-color: #1a1a1a;
            color: #ffffff;
            border: 1.5px solid #444444;
        }

        @keyframes flash-stop {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.92); }
            100% { opacity: 1; transform: scale(1); }
        }

        .is-stopped {
            animation: flash-stop 1.2s infinite ease-in-out;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([47.4979, 19.0402], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        const markers = {};
        const HIDE_ZOOM_THRESHOLD = 14;

        function getNormalizedVehicleType(v) {
            const rawType = String(v.vehicleType || v.routeType || '').toLowerCase();
            const routeNum = String(v.routeNumber || v.routeId || '').toUpperCase();

            if (/^H[5-9]$/.test(routeNum) || routeNum.includes('HÉV') || routeNum.includes('HEV')) {
                return 'suburban_rail';
            }

            if (rawType === '109' || rawType === 'suburban_rail' || rawType === 'hev') {
                return 'suburban_rail';
            }
            if (rawType === '2' || rawType === 'rail' || rawType === 'train') {
                return 'train';
            }
            if (rawType === '0' || rawType === 'tram') {
                return 'tram';
            }
            if (rawType === '11' || rawType === 'trolley' || rawType === 'trolleybus') {
                return 'trolley';
            }
            if (rawType === '3' || rawType === 'bus') {
                return 'bus';
            }

            return rawType || 'bus';
        }

        async function fetchVehicles() {
            try {
                const response = await fetch('https://busradar26.onrender.com/api/buses');
                const vehicles = await response.json();

                const currentVehicleIds = new Set();
                const currentZoom = map.getZoom();
                const shouldHide = currentZoom < HIDE_ZOOM_THRESHOLD;

                vehicles.forEach(v => {
                    currentVehicleIds.add(v.id);

                    let displayLabel = v.routeNumber || 'N/A';
                    const lat = v.latitude;
                    const lon = v.longitude;

                    if (!lat || !lon) return;

                    const vType = getNormalizedVehicleType(v);
                    let colorClass = `badge-${vType}`;

                    if (!displayLabel || displayLabel === 'N/A') {
                        colorClass = 'badge-na';
                    } else if (displayLabel.includes('0161')) {
                        displayLabel = '16A';
                    } else if (displayLabel.includes('0085')) {
                        displayLabel = '8E';
                    } else if (/^(IC|Ex|Sz|S\d+|Z\d+)$/i.test(displayLabel) || displayLabel.startsWith('S') || displayLabel.startsWith('Z')) {
                        colorClass = 'badge-train';
                    }

                    const isStopped = v.currentStatus === 'STOPPED_AT' || v.currentStatus === 0;
                    const stopClass = isStopped ? 'is-stopped' : '';

                    const vehicleIcon = L.divIcon({
                        className: '',
                        html: `<div class="transit-badge ${colorClass} ${stopClass}">${displayLabel}</div>`,
                        iconSize: [38, 20],
                        iconAnchor: [19, 10]
                    });

                    // Updated popup: Destination included, status and model removed
                    const destination = v.destination || v.tripHeadsign || v.headsign || 'Unknown';
                    const popupContent = `<b>Line:</b> ${displayLabel}<br><b>Type:</b> ${vType.toUpperCase().replace('_', ' ')}<br><b>Destination:</b> ${destination}<br><b>Plate:</b> ${v.licensePlate || 'N/A'}`;

                    if (markers[v.id]) {
                        markers[v.id].setLatLng([lat, lon]);
                        markers[v.id].setIcon(vehicleIcon);
                        markers[v.id].bindPopup(popupContent);
                        
                        if (shouldHide) {
                            if (map.hasLayer(markers[v.id])) map.removeLayer(markers[v.id]);
                        } else {
                            if (!map.hasLayer(markers[v.id])) markers[v.id].addTo(map);
                        }
                    } else {
                        const marker = L.marker([lat, lon], { icon: vehicleIcon });
                        if (!shouldHide) {
                            marker.addTo(map);
                        }
                        marker.bindPopup(popupContent);
                        markers[v.id] = marker;
                    }
                });

                for (let id in markers) {
                    if (!currentVehicleIds.has(id)) {
                        map.removeLayer(markers[id]);
                        delete markers[id];
                    }
                }
            } catch (err) {
                console.error('Error fetching vehicles:', err);
            }
        }

        map.on('zoomend', () => {
            const currentZoom = map.getZoom();
            const shouldHide = currentZoom < HIDE_ZOOM_THRESHOLD;
            
            for (let id in markers) {
                if (shouldHide) {
                    if (map.hasLayer(markers[id])) map.removeLayer(markers[id]);
                } else {
                    if (!map.hasLayer(markers[id])) markers[id].addTo(map);
                }
            }
        });

        fetchVehicles();
        setInterval(fetchVehicles, 5000);
    </script>
</body>
</html>
