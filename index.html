<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BKK Live Tracker</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Firebase App & Firestore & Auth (Compat SDKs) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #map {
            height: 100%;
            width: 100%;
        }

        /* UI Control Wrapper at Top-Left */
        #ui-overlay {
            position: absolute;
            top: 10px;
            left: 55px; /* Offset from Leaflet zoom controls */
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-width: calc(100vw - 70px);
        }

        /* Search Filter UI Row */
        #filter-row {
            display: flex;
            align-items: center;
            gap: 6px;
            width: 100%;
        }

        #filter-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 6px 8px;
            border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            min-width: 0;
        }
        #filter-input {
            border: 1px solid #ccc;
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            width: 100%;
            min-width: 60px;
            font-weight: 500;
            box-sizing: border-box;
        }
        #filter-input:focus {
            border-color: #007bff;
            box-shadow: 0 0 4px rgba(0, 123, 255, 0.3);
        }

        /* Filter Mode Toggle Button */
        #mode-btn {
            background-color: #f8f9fa;
            border: 1px solid #ccc;
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            transition: all 0.2s;
            white-space: nowrap;
            flex-shrink: 0;
        }
        #mode-btn:hover {
            background-color: #e2e6ea;
        }

        /* Circular Profile Button */
        #profile-btn {
            width: 36px;
            height: 36px;
            min-width: 36px;
            min-height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
            outline: none;
            transition: background-color 0.2s;
            flex-shrink: 0;
        }
        #profile-btn:hover {
            background-color: #e2e6ea;
        }
        #profile-btn.logged-in {
            border-color: #198754;
            background-color: #d1e7dd;
        }

        /* Logged Trips Button */
        #logged-trips-btn {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #ccc;
            padding: 7px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
            text-align: left;
            outline: none;
            color: #333;
            transition: background-color 0.2s;
            width: fit-content;
        }
        #logged-trips-btn:hover {
            background-color: #f1f3f5;
        }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2000;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.3);
            width: 320px;
            max-width: 90vw;
            max-height: 85vh;
            overflow-y: auto;
            box-sizing: border-box;
        }

        .transit-badge {
            padding: 2px 7px;
            font-weight: 800;
            font-size: 11px;
            border-radius: 5px;
            text-align: center;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.4);
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .badge-bus { background-color: #007bff; color: #ffffff; border: 1.5px solid #0056b3; }
        .badge-tram { background-color: #ffd700; color: #000000; border: 1.5px solid #d4ac0d; }
        .badge-trolley { background-color: #dc3545; color: #ffffff; border: 1.5px solid #a71d2a; }
        .badge-train { background-color: #002D62; color: #ffffff; border: 1.5px solid #001A3D; }
        .badge-suburban_rail { background-color: #198754; color: #ffffff; border: 1.5px solid #146c43; }
        .badge-na { background-color: #1a1a1a; color: #ffffff; border: 1.5px solid #444444; }

        @keyframes flash-stop {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.92); }
            100% { opacity: 1; transform: scale(1); }
        }
        .is-stopped { animation: flash-stop 1.2s infinite ease-in-out; }
    </style>
</head>
<body>

    <!-- UI Overlay Controls -->
    <div id="ui-overlay">
        <div id="filter-row">
            <!-- Search Filter Container -->
            <div id="filter-container">
                <input type="text" id="filter-input" placeholder="Filter..." />
                <button id="mode-btn" title="Click to change filter mode">🔍 All</button>
            </div>
            <!-- Circular Profile Button -->
            <button id="profile-btn" title="Account / Login">👤</button>
        </div>
        <!-- Logged Trips Button -->
        <button id="logged-trips-btn">📋 Logged Trips</button>
    </div>

    <!-- Auth Modal (Login / Register) -->
    <div id="auth-modal" class="modal">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <h3 id="auth-title" style="margin: 0; font-size: 16px; color: #111;">Account Login</h3>
            <button id="close-auth-btn" style="background: none; border: none; font-size: 20px; cursor: pointer; font-weight: bold; color: #666;">&times;</button>
        </div>
        <div id="auth-body">
            <input type="email" id="auth-email" placeholder="Email" style="width: 100%; padding: 8px; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;" />
            <input type="password" id="auth-password" placeholder="Password" style="width: 100%; padding: 8px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;" />
            <button id="auth-submit-btn" style="width: 100%; background: #007bff; color: white; border: none; padding: 8px; border-radius: 6px; font-weight: 600; cursor: pointer;">Sign In</button>
            <p style="text-align: center; font-size: 12px; margin-top: 10px; color: #666;">
                <span id="auth-toggle-text">Don't have an account?</span> 
                <a href="#" id="auth-switch-mode" style="color: #007bff; text-decoration: none; font-weight: 600;">Register</a>
            </p>
        </div>
        <div id="auth-logged-in-view" style="display: none; text-align: center;">
            <p id="user-email-display" style="font-size: 13px; color: #333; margin-bottom: 15px; font-weight: 500;"></p>
            <button id="logout-btn" style="width: 100%; background: #dc3545; color: white; border: none; padding: 8px; border-radius: 6px; font-weight: 600; cursor: pointer;">Sign Out</button>
        </div>
    </div>

    <!-- Modal for viewing logs -->
    <div id="logs-modal" class="modal">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h3 id="logs-modal-title" style="margin: 0; font-size: 16px; color: #111;">Logged Trips</h3>
            <button id="close-logs-btn" style="background: none; border: none; font-size: 20px; cursor: pointer; font-weight: bold; color: #666;">&times;</button>
        </div>
        <div id="logs-content" style="font-size: 13px; color: #333;">Loading...</div>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Initialize Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCYZ_dF-pSt-N1vzY0cCl9_-U6pdP9vMJo",
            authDomain: "budapestradar26.firebaseapp.com",
            projectId: "budapestradar26",
            storageBucket: "budapestradar26.firebasestorage.app",
            messagingSenderId: "258977567627",
            appId: "1:258977567627:web:aa600e0d1aad576e85158e",
            measurementId: "G-XRM4409JGL"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let currentUser = null;
        let isRegisterMode = false;

        auth.onAuthStateChanged((user) => {
            currentUser = user;
            const profileBtn = document.getElementById('profile-btn');
            const authBody = document.getElementById('auth-body');
            const loggedInView = document.getElementById('auth-logged-in-view');
            const emailDisplay = document.getElementById('user-email-display');

            if (user) {
                profileBtn.classList.add('logged-in');
                profileBtn.title = `Logged in as ${user.email}`;
                authBody.style.display = 'none';
                loggedInView.style.display = 'block';
                emailDisplay.textContent = `Signed in as: ${user.email}`;
            } else {
                profileBtn.classList.remove('logged-in');
                profileBtn.title = 'Account / Login';
                authBody.style.display = 'block';
                loggedInView.style.display = 'none';
            }
        });

        document.getElementById('profile-btn').addEventListener('click', () => {
            document.getElementById('auth-modal').style.display = 'block';
        });

        document.getElementById('close-auth-btn').addEventListener('click', () => {
            document.getElementById('auth-modal').style.display = 'none';
        });

        document.getElementById('auth-switch-mode').addEventListener('click', (e) => {
            e.preventDefault();
            isRegisterMode = !isRegisterMode;
            document.getElementById('auth-title').textContent = isRegisterMode ? 'Create Account' : 'Account Login';
            document.getElementById('auth-submit-btn').textContent = isRegisterMode ? 'Register' : 'Sign In';
            document.getElementById('auth-toggle-text').textContent = isRegisterMode ? 'Already have an account?' : "Don't have an account?";
            document.getElementById('auth-switch-mode').textContent = isRegisterMode ? 'Sign In' : 'Register';
        });

        document.getElementById('auth-submit-btn').addEventListener('click', async () => {
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value.trim();

            if (!email || !password) {
                alert("Please fill in both email and password.");
                return;
            }

            try {
                if (isRegisterMode) {
                    await auth.createUserWithEmailAndPassword(email, password);
                    alert("Account created and logged in successfully!");
                } else {
                    await auth.signInWithEmailAndPassword(email, password);
                    alert("Logged in successfully!");
                }
                document.getElementById('auth-modal').style.display = 'none';
            } catch (error) {
                console.error("Auth error:", error);
                alert("Authentication failed: " + error.message);
            }
        });

        document.getElementById('logout-btn').addEventListener('click', async () => {
            try {
                await auth.signOut();
                alert("Logged out successfully.");
                document.getElementById('auth-modal').style.display = 'none';
            } catch (error) {
                console.error("Logout error:", error);
            }
        });

        function getClientInfo() {
            const ua = navigator.userAgent;
            let browser = "Unknown Browser";
            let os = "Unknown OS";

            if (ua.indexOf("Win") !== -1) os = "Windows";
            else if (ua.indexOf("Mac") !== -1) os = "macOS";
            else if (ua.indexOf("iPhone") !== -1 || ua.indexOf("iPad") !== -1) os = "iOS";
            else if (ua.indexOf("Android") !== -1) os = "Android";
            else if (ua.indexOf("Linux") !== -1) os = "Linux";

            if (ua.indexOf("Edg") !== -1) browser = "Microsoft Edge";
            else if (ua.indexOf("Chrome") !== -1 && ua.indexOf("Edg") === -1) browser = "Google Chrome";
            else if (ua.indexOf("Safari") !== -1 && ua.indexOf("Chrome") === -1) browser = "Apple Safari";
            else if (ua.indexOf("Firefox") !== -1) browser = "Mozilla Firefox";
            else if (ua.indexOf("Opera") !== -1 || ua.indexOf("OPR") !== -1) browser = "Opera";

            return { os, browser };
        }
